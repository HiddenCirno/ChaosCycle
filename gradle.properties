# ---- Gradle ----
# 本机默认编码是 GBK；源码/语言文件含中文，必须强制 UTF-8。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true

# 代理与 JDK 路径属于本机配置，放在 ~/.gradle/gradle.properties，不写进仓库。

# ---- 模组元数据 ----
mod_id=chaoscycle
mod_name=Chaos Cycle
mod_license=AGPL-3.0-only
mod_version=0.1.0
mod_group_id=com.chaoscycle
mod_authors=HiddenSummer
mod_description=Debug tools for Minecraft 1.20.1: a portable command executor with four game-mode buttons, permission-level-2 command input and in-GUI output, plus a portable hyperspace locator with named, dimension-aware waypoints. Optional Curios support.

# ---- 平台 ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
parchment_version=2023.07.16-1.20.1

# 软依赖：与本整合包实际安装的版本一致。
curios_version=5.14.1+1.20.1
